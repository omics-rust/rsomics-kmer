name: Canonical hashing measurements

on:
  workflow_dispatch:
    inputs:
      assembly_only:
        description: Collect code generation without rerunning measurements
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  paired:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: d89e2df0d8eae38b64eb7b43a41f57436fc25bb4
          path: baseline
      - uses: actions/checkout@v6
        with:
          ref: 23e42f37e9578e59d9935c0d529b07d1aac49eb9
          path: reference
      - name: Use isolated runner build paths
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target-candidate" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Record source and machine provenance
        run: |
          mkdir -p "$RUNNER_TEMP/measurements"
          cmp baseline/benches/codec.rs benches/codec.rs
          cmp baseline/Cargo.toml Cargo.toml
          cmp baseline/Cargo.lock Cargo.lock
          cmp reference/benches/codec.rs benches/codec.rs
          cmp reference/Cargo.toml Cargo.toml
          cmp reference/Cargo.lock Cargo.lock
          {
            date -u
            uname -a
            if [[ "$RUNNER_OS" == Linux ]]; then lscpu; else sysctl -n machdep.cpu.brand_string; fi
            rustc -Vv
            cargo -V
            git rev-parse HEAD
            git -C baseline rev-parse HEAD
            git -C reference rev-parse HEAD
            shasum -a 256 benches/codec.rs Cargo.lock src/hash.rs baseline/src/hash.rs reference/src/hash.rs
          } > "$RUNNER_TEMP/measurements/provenance.txt"
      - name: Measure six balanced baseline, reference and candidate triplets
        if: '!inputs.assembly_only'
        run: |
          for variant in baseline reference candidate; do
            manifest=Cargo.toml
            if [[ "$variant" != candidate ]]; then manifest="$variant/Cargo.toml"; fi
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-$variant" \
              cargo bench --manifest-path "$manifest" --locked --bench codec --no-run
          done
          for round in 1 2 3 4 5 6; do
            case "$round" in
              1) variants=(baseline reference candidate) ;;
              2) variants=(candidate reference baseline) ;;
              3) variants=(reference candidate baseline) ;;
              4) variants=(baseline candidate reference) ;;
              5) variants=(candidate baseline reference) ;;
              6) variants=(reference baseline candidate) ;;
            esac
            for variant in "${variants[@]}"; do
              manifest=Cargo.toml
              if [[ "$variant" != candidate ]]; then manifest="$variant/Cargo.toml"; fi
              CARGO_TARGET_DIR="$RUNNER_TEMP/target-$variant" \
                cargo bench --manifest-path "$manifest" --locked --bench codec -- \
                  canonical_murmur64 --sample-size 50 --warm-up-time 1 \
                  --measurement-time 3 --save-baseline "round-$round" \
                2>&1 | tee "$RUNNER_TEMP/measurements/$variant-$round.log"
            done
          done
          for variant in baseline reference candidate; do
            cp -R "$RUNNER_TEMP/target-$variant/criterion/canonical_murmur64" \
              "$RUNNER_TEMP/measurements/$variant"
          done
      - name: Retain optimized library and caller assembly
        run: |
          shopt -s nullglob
          for variant in baseline reference candidate; do
            manifest=Cargo.toml
            if [[ "$variant" != candidate ]]; then manifest="$variant/Cargo.toml"; fi
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-$variant" \
              cargo rustc --manifest-path "$manifest" --locked --release --lib -- --emit=asm
            assembly=("$RUNNER_TEMP/target-$variant"/release/deps/rsomics_kmer-*.s)
            test "${#assembly[@]}" -eq 1
            cp "${assembly[0]}" "$RUNNER_TEMP/measurements/$variant.s"
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-$variant" \
              cargo rustc --manifest-path "$manifest" --locked --profile bench --bench codec -- --emit=asm
            assembly=("$RUNNER_TEMP/target-$variant"/release/deps/codec-*.s)
            test "${#assembly[@]}" -eq 1
            cp "${assembly[0]}" "$RUNNER_TEMP/measurements/$variant-bench.s"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-hashing-${{ matrix.runner }}
          path: ${{ runner.temp }}/measurements
          if-no-files-found: error
          retention-days: 90
