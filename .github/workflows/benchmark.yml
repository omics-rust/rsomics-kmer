name: Canonical hashing measurements

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    defaults:
      run:
        shell: bash
    env:
      BASELINE_REVISION: d89e2df0d8eae38b64eb7b43a41f57436fc25bb4
      REFERENCE_REVISION: 23e42f37e9578e59d9935c0d529b07d1aac49eb9
    steps:
      - uses: actions/checkout@v6
      - name: Use isolated runner build paths
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target-harness" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - name: Create an unpublished comparison harness
        run: |
          mkdir -p "$RUNNER_TEMP/harness/src" "$RUNNER_TEMP/measurements"
          cp .github/benchmarks/compare-hashes.rs "$RUNNER_TEMP/harness/src/main.rs"
          printf '[package]\nname = "canonical-hash-comparison"\nversion = "0.0.0"\nedition = "2024"\npublish = false\n\n[dependencies]\nbaseline = { package = "rsomics-kmer", git = "https://github.com/omics-rust/rsomics-kmer", rev = "%s" }\nreference = { package = "rsomics-kmer", git = "https://github.com/omics-rust/rsomics-kmer", rev = "%s" }\ncandidate = { package = "rsomics-kmer", git = "https://github.com/omics-rust/rsomics-kmer", rev = "%s" }\n' \
            "$BASELINE_REVISION" "$REFERENCE_REVISION" "$GITHUB_SHA" > "$RUNNER_TEMP/harness/Cargo.toml"
      - name: Verify all three compiled dependency identities
        working-directory: ${{ runner.temp }}/harness
        run: |
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/measurements/metadata.json"
          jq -e --arg b "$BASELINE_REVISION" --arg r "$REFERENCE_REVISION" --arg c "$GITHUB_SHA" '
            ([.packages[] | select(.name == "rsomics-kmer") | .source | split("#")[-1]] | sort) == ([$b, $r, $c] | sort)
            and .target_directory == env.CARGO_TARGET_DIR
          ' "$RUNNER_TEMP/measurements/metadata.json"
          cp Cargo.toml Cargo.lock src/main.rs "$RUNNER_TEMP/measurements/"
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
      - name: Record source and machine provenance
        run: |
          {
            date -u
            uname -a
            if [[ "$RUNNER_OS" == Linux ]]; then lscpu; else sysctl -n machdep.cpu.brand_string; fi
            rustc -Vv
            cargo -V
            git rev-parse HEAD
            shasum -a 256 .github/benchmarks/compare-hashes.rs "$CARGO_TARGET_DIR/release/canonical-hash-comparison"
            jq -r '.packages[] | select(.name == "rsomics-kmer") | .manifest_path' "$RUNNER_TEMP/measurements/metadata.json" |
              while IFS= read -r manifest; do shasum -a 256 "$(dirname "$manifest")/src/hash.rs"; done
          } > "$RUNNER_TEMP/measurements/provenance.txt"
      - name: Interleave variants in one process
        run: |
          binary="$CARGO_TARGET_DIR/release/canonical-hash-comparison"
          if [[ "$RUNNER_OS" == Linux ]]; then
            cpu_list=$(awk '$1 == "Cpus_allowed_list:" { print $2 }' /proc/self/status)
            bench_cpu=${cpu_list%%[-,]*}
            echo "cpu_affinity=$bench_cpu" >> "$RUNNER_TEMP/measurements/provenance.txt"
            taskset -c "$bench_cpu" "$binary" "$RUNNER_TEMP/measurements"
          else
            echo "cpu_affinity=unavailable" >> "$RUNNER_TEMP/measurements/provenance.txt"
            "$binary" "$RUNNER_TEMP/measurements"
          fi
          shasum -a 256 "$RUNNER_TEMP/measurements/input.bin" >> "$RUNNER_TEMP/measurements/provenance.txt"
          cat "$RUNNER_TEMP/measurements/observations.csv"
          cp "$binary" "$RUNNER_TEMP/measurements/"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: canonical-hashing-${{ matrix.runner }}
          path: ${{ runner.temp }}/measurements
          if-no-files-found: error
          retention-days: 90
