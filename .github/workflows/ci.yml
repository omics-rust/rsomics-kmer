name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo bench --locked --bench codec -- --test
      - run: cargo package --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
      - run: cargo test --locked --all-targets --all-features
      - name: Reproduce short-window bounds regression
        shell: bash
        run: |
          set +e
          cargo test --locked --test canonical_windows -- --ignored > "$RUNNER_TEMP/kmer-short.log" 2>&1
          test_rc=$?
          set -e
          cat "$RUNNER_TEMP/kmer-short.log"
          test "$test_rc" -eq 101
          grep -F '2 failed' "$RUNNER_TEMP/kmer-short.log"
          grep -F 'range end index' "$RUNNER_TEMP/kmer-short.log"
